# The proxy maps the approved tailnet group to this Kubernetes group. This is
# intentionally an inventory role, not cluster-admin: no Secret data, exec,
# port-forward, create, update, patch, or delete permission is granted.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rudtal-k8s-routine-reader
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - nodes
      - pods
      - services
      - events
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources:
      - daemonsets
      - deployments
      - replicasets
      - statefulsets
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources:
      - cronjobs
      - jobs
    verbs: [get, list, watch]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources:
      - gitrepositories
      - helmrepositories
      - ocirepositories
    verbs: [get, list, watch]
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources:
      - kustomizations
    verbs: [get, list, watch]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources:
      - helmreleases
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rudtal-k8s-routine-readers
subjects:
  - kind: Group
    name: rudtal-k8s-routine-readers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: rudtal-k8s-routine-reader
  apiGroup: rbac.authorization.k8s.io
