# Cilium 1.18.13 on Talos 1.12.12 / Kubernetes 1.35.8.
# The matching Flux OCIRepository pins the chart manifest digest.
ipam:
  mode: kubernetes

# First experiment retains the Talos-generated kube-proxy DaemonSet.
kubeProxyReplacement: false

# Use the chart's supported VXLAN tunnel mode on the shared LAN.
routingMode: tunnel
tunnelProtocol: vxlan
autoDirectNodeRoutes: false

# Talos supplies cgroup v2 and bpffs; Cilium must consume, not mount, them.
bpf:
  autoMount:
    enabled: false
  root: /sys/fs/bpf
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

# Talos does not allow workload kernel-module loading.
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

# Pin the Cilium agent and generic operator to release digests published upstream.
image:
  repository: quay.io/cilium/cilium
  tag: v1.18.13
  digest: sha256:6e6e6a82a6a2a6d0bfe6dd7e36cb0222fa48135ad139ddc979b5c3c841e2db1a
  useDigest: true
operator:
  replicas: 2
  image:
    repository: quay.io/cilium/operator
    tag: v1.18.13
    genericDigest: sha256:2041417ad2ebd8b3e7d80b63dd81810d405fa29f12926ddbe78321a74781993b
    useDigest: true
envoy:
  image:
    repository: quay.io/cilium/cilium-envoy
    tag: v1.36.9-1786864149-07e8503ff34b9190d7bbe4e57d4e185c4ef8b1de
    digest: sha256:beccdf3c119f299cf696885188584bbd0531d74bca08096113207999aff95e87
    useDigest: true
