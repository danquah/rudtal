# Cilium 1.20.1 on Talos 1.12.12 / Kubernetes 1.35.8.
# The matching Flux OCIRepository pins the chart manifest digest.
ipam:
  mode: kubernetes

# First experiment retains the Talos-generated kube-proxy DaemonSet.
kubeProxyReplacement: false

# Use the chart's supported VXLAN tunnel mode on the shared LAN.
routingMode: tunnel
tunnelProtocol: vxlan
autoDirectNodeRoutes: false

# Talos supplies cgroup v2 and bpffs; Cilium must consume, not mount, them.
bpf:
  autoMount:
    enabled: false
  root: /sys/fs/bpf
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

# Talos does not allow workload kernel-module loading.
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

# Pin the Cilium agent and generic operator to release digests published upstream.
image:
  repository: quay.io/cilium/cilium
  tag: v1.20.1
  digest: sha256:ae9ea21f7427fe24bc6ea7247eb552157a1b0a431744045d3f641545ca71d11b
  useDigest: true
operator:
  replicas: 2
  image:
    repository: quay.io/cilium/operator
    tag: v1.20.1
    genericDigest: sha256:6c3885fc7b629099fdbe2a5c87869c86feb825fa18fae299eac0f61918d16ecf
    useDigest: true
envoy:
  image:
    repository: quay.io/cilium/cilium-envoy
    tag: v1.37.5-1786810558-766ccfb37260a43e9d228837aa84ce3faf9f64e7
    digest: sha256:75b8094c7127736a2ffd2dce3945e0931cb6df21b0372ff661940eca26730b91
    useDigest: true
